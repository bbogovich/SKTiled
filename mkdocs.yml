site_name: SKTiled
site_description: Swift framework for using Tiled assets with SpriteKit
repo_url: https://github.com/bbogovich/SKTiled
edit_uri: edit/master/Docs/
docs_dir: Docs
site_dir: site
strict: true

exclude_docs: |
  images/src/
  images/**/*.psd
  images/**/*.aseprite

validation:
  nav:
    # the API reference is generated by DocC into site/api/ (scripts/build-docs.sh)
    not_found: info
  links:
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - What's New: whats-new.md
  - Getting Started: getting-started.md
  - Guides:
      - Scene Setup: scene-setup.md
      - Working with Maps: working-with-maps.md
      - Working with Tilesets: working-with-tilesets.md
      - Working with Layers: working-with-layers.md
      - Working with Tiles: working-with-tiles.md
      - Coordinates: coordinates.md
      - Working with Objects: working-with-objects.md
      - Tiled Properties: tiled-properties.md
      - GameplayKit: gameplaykit.md
      - Extending SKTiled: extending-sktiled.md
      - Other API Features: other-api-features.md
  - Debugging: debugging.md
  - Troubleshooting: troubleshooting.md
  - Developer Guide:
      - developer/index.md
      - Creating a SwiftUI App: developer/swiftui-app.md
      - Demo App: developer/demo-app.md
      - How SKTiled Works: developer/internals.md
      - Working on SKTiled: developer/contributing.md
  - API Reference: api/documentation/sktiled/index.html
