name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # swift-tools-version 6.2 needs Xcode 26 or later.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (macOS)
        run: xcrun swift test
      - name: Build (iOS and tvOS)
        run: |
          xcodebuild build -scheme SKTiled -destination 'generic/platform=iOS' -quiet
          xcodebuild build -scheme SKTiled -destination 'generic/platform=tvOS' -quiet
      - name: Build demo
        run: |
          for destination in 'platform=macOS' 'generic/platform=iOS Simulator' 'generic/platform=tvOS Simulator'; do
            xcodebuild build -project Demo/SKTiledDemo.xcodeproj -scheme SKTiledDemo \
              -destination "$destination" CODE_SIGNING_ALLOWED=NO -quiet
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build
